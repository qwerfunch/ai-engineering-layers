<!-- Source for docs/assets/img/graph-engineering.gif.
     Every animation shares one 6s cycle and is frozen at --t, so frames can be
     sampled deterministically: set document.documentElement.style --t to
     0, 6/N, 2*6/N … and snapshot at 900x340, then
       magick -delay 12 -loop 0 f*.png -colors 96 -layers OptimizePlus out.gif -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:900px;height:340px;overflow:hidden;background:#0c0c0b}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  svg{display:block}
  .lbl{font-size:12.5px;font-weight:700;fill:#e8e7e0}
  .sub{font-size:10.5px;font-weight:500;fill:#8b8a84}
  .cap{font-size:12px;font-weight:600;fill:#6e6d67}
  .stage{font-size:11px;font-weight:800;fill:#5d5c57;letter-spacing:2.4px}

  /* every animation shares one 6s cycle, frozen at --t by the frame renderer */
  .a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:linear;
     animation-play-state:paused;animation-delay:calc(var(--t,0) * -1s)}

  /* edge pulses ------------------------------------------------------- */
  @keyframes fan{0%,2%{opacity:0}4%{opacity:1}18%{opacity:1}20%,100%{opacity:0}}
  @keyframes hop{0%,26%{opacity:0}28%{opacity:1}42%{opacity:1}44%,100%{opacity:0}}
  @keyframes out{0%,62%{opacity:0}64%{opacity:1}80%{opacity:1}82%,100%{opacity:0}}
  .p1{animation-name:fan} .p2{animation-name:hop} .p3{animation-name:out}

  @keyframes m1{0%,2%{transform:translate(0,0)}20%,100%{transform:var(--to)}}
  .mv{animation-name:m1}
  @keyframes m2{0%,26%{transform:translate(0,0)}44%,100%{transform:var(--to)}}
  .mv2{animation-name:m2}
  @keyframes m3{0%,62%{transform:translate(0,0)}82%,100%{transform:var(--to)}}
  .mv3{animation-name:m3}

  /* node activation ---------------------------------------------------- */
  @keyframes lensOn{0%,16%{opacity:.32}20%{opacity:1}46%{opacity:1}52%,100%{opacity:.32}}
  .lens{animation-name:lensOn}
  @keyframes verOn{0%,42%{opacity:.3}46%{opacity:1}88%{opacity:1}94%,100%{opacity:.3}}
  .ver{animation-name:verOn}
  @keyframes gateOn{0%,60%{opacity:.3}64%{opacity:1}92%{opacity:1}96%,100%{opacity:.3}}
  .gate{animation-name:gateOn}

  /* verdicts: two survive, one is refuted -------------------------------- */
  @keyframes pass{0%,50%{opacity:0}56%{opacity:1}92%{opacity:1}96%,100%{opacity:0}}
  @keyframes kill{0%,50%{opacity:0}56%{opacity:1}92%{opacity:1}96%,100%{opacity:0}}
  .pass{animation-name:pass} .kill{animation-name:kill}

  /* the refuted finding never leaves the verifier */
  @keyframes result{0%,78%{opacity:0}84%{opacity:1}96%{opacity:1}99%,100%{opacity:0}}
  .res{animation-name:result}
</style></head><body>

<svg width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#3d3d38"/>
    </marker>
  </defs>

  <!-- stage captions -->
  <text class="stage" x="42"  y="30">INPUT</text>
  <text class="stage" x="232" y="30">FAN OUT · 3 LENSES</text>
  <text class="stage" x="484" y="30">VERIFY · REFUTE</text>
  <text class="stage" x="702" y="30">GATE</text>

  <!-- ── edges ───────────────────────────────────────────────────────── -->
  <g stroke="#2c2c28" stroke-width="1.7" fill="none" marker-end="url(#ar)">
    <path d="M132 170 C 170 170, 172 92,  222 92"/>
    <path d="M132 170 H 222"/>
    <path d="M132 170 C 170 170, 172 248, 222 248"/>
    <path d="M358 92  H 452"/><path d="M358 170 H 452"/><path d="M358 248 H 452"/>
    <path d="M588 92  C 640 92,  646 170, 690 170"/>
    <path d="M588 170 H 690"/>
    <path d="M588 248 C 640 248, 646 170, 690 170"/>
    <path d="M772 170 H 828"/>
  </g>

  <!-- ── input ───────────────────────────────────────────────────────── -->
  <g>
    <rect x="30" y="148" width="102" height="44" rx="11" fill="#1a1a18" stroke="#3d3d38" stroke-width="1.5"/>
    <text class="lbl" x="81" y="167" text-anchor="middle">git diff</text>
    <text class="sub" x="81" y="182" text-anchor="middle">312 lines</text>
  </g>

  <!-- ── three lenses ────────────────────────────────────────────────── -->
  <g class="a lens">
    <rect x="222" y="70" width="136" height="44" rx="11" fill="#132234" stroke="#2a78d6" stroke-width="1.6"/>
    <text class="lbl" x="290" y="89"  text-anchor="middle" style="fill:#6aa6ea">correctness</text>
    <text class="sub" x="290" y="104" text-anchor="middle">own context</text>
  </g>
  <g class="a lens">
    <rect x="222" y="148" width="136" height="44" rx="11" fill="#2c1a12" stroke="#eb6834" stroke-width="1.6"/>
    <text class="lbl" x="290" y="167" text-anchor="middle" style="fill:#f08a5c">security</text>
    <text class="sub" x="290" y="182" text-anchor="middle">own context</text>
  </g>
  <g class="a lens">
    <rect x="222" y="226" width="136" height="44" rx="11" fill="#102821" stroke="#1baf7a" stroke-width="1.6"/>
    <text class="lbl" x="290" y="245" text-anchor="middle" style="fill:#42d29c">performance</text>
    <text class="sub" x="290" y="260" text-anchor="middle">own context</text>
  </g>

  <!-- ── verifiers ───────────────────────────────────────────────────── -->
  <g class="a ver">
    <rect x="452" y="70" width="136" height="44" rx="11" fill="#2a1620" stroke="#e87ba4" stroke-width="1.6"/>
    <text class="lbl" x="520" y="89"  text-anchor="middle" style="fill:#ef9bbd">refute it</text>
    <text class="sub" x="520" y="104" text-anchor="middle">independent</text>
  </g>
  <g class="a ver">
    <rect x="452" y="148" width="136" height="44" rx="11" fill="#2a1620" stroke="#e87ba4" stroke-width="1.6"/>
    <text class="lbl" x="520" y="167" text-anchor="middle" style="fill:#ef9bbd">refute it</text>
    <text class="sub" x="520" y="182" text-anchor="middle">independent</text>
  </g>
  <g class="a ver">
    <rect x="452" y="226" width="136" height="44" rx="11" fill="#2a1620" stroke="#e87ba4" stroke-width="1.6"/>
    <text class="lbl" x="520" y="245" text-anchor="middle" style="fill:#ef9bbd">refute it</text>
    <text class="sub" x="520" y="260" text-anchor="middle">independent</text>
  </g>

  <!-- verdicts -->
  <g class="a pass"><circle cx="600" cy="92" r="10" fill="#0d2a1f" stroke="#2ec98f" stroke-width="1.8"/>
    <path d="M595 92 l3.6 3.8 6.4 -7.6" stroke="#2ec98f" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="a kill"><circle cx="600" cy="170" r="10" fill="#2c1414" stroke="#e05555" stroke-width="1.8"/>
    <path d="M596 166 l8 8 M604 166 l-8 8" stroke="#e05555" stroke-width="2.3" stroke-linecap="round"/></g>
  <g class="a pass"><circle cx="600" cy="248" r="10" fill="#0d2a1f" stroke="#2ec98f" stroke-width="1.8"/>
    <path d="M595 248 l3.6 3.8 6.4 -7.6" stroke="#2ec98f" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- ── deterministic gate ──────────────────────────────────────────── -->
  <g class="a gate">
    <rect x="690" y="148" width="82" height="44" rx="11" fill="#132234" stroke="#2a78d6" stroke-width="1.6"/>
    <text class="lbl" x="731" y="167" text-anchor="middle" style="fill:#6aa6ea">merge</text>
    <text class="sub" x="731" y="182" text-anchor="middle">in code</text>
  </g>

  <!-- ── result ──────────────────────────────────────────────────────── -->
  <g class="a res">
    <rect x="828" y="148" width="60" height="44" rx="11" fill="#1a1a18" stroke="#4a4a45" stroke-width="1.5"/>
    <text class="lbl" x="858" y="167" text-anchor="middle" style="font-size:16px">2</text>
    <text class="sub" x="858" y="182" text-anchor="middle">kept</text>
  </g>

  <!-- ── travelling pulses ───────────────────────────────────────────── -->
  <!-- diff → lenses -->
  <g class="a p1"><circle class="a mv" cx="140" cy="170" r="5" fill="#6aa6ea" style="--to:translate(74px,-78px)"/></g>
  <g class="a p1"><circle class="a mv" cx="140" cy="170" r="5" fill="#f08a5c" style="--to:translate(74px,0px)"/></g>
  <g class="a p1"><circle class="a mv" cx="140" cy="170" r="5" fill="#42d29c" style="--to:translate(74px,78px)"/></g>
  <!-- lenses → verifiers (a finding each) -->
  <g class="a p2"><circle class="a mv2" cx="366" cy="92"  r="5" fill="#6aa6ea" style="--to:translate(80px,0px)"/></g>
  <g class="a p2"><circle class="a mv2" cx="366" cy="170" r="5" fill="#f08a5c" style="--to:translate(80px,0px)"/></g>
  <g class="a p2"><circle class="a mv2" cx="366" cy="248" r="5" fill="#42d29c" style="--to:translate(80px,0px)"/></g>
  <!-- survivors → gate (the middle one is gone) -->
  <g class="a p3"><circle class="a mv3" cx="596" cy="92"  r="5" fill="#2ec98f" style="--to:translate(98px,78px)"/></g>
  <g class="a p3"><circle class="a mv3" cx="596" cy="248" r="5" fill="#2ec98f" style="--to:translate(98px,-78px)"/></g>

  <!-- footer note -->
  <text class="cap" x="30" y="318">Three lenses look in parallel · each finding faces an independent refuter · code does the merging</text>
</svg>
</body></html>
