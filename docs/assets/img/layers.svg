<marker id="arLoop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#eda100"/></marker>
<marker id="arGood" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0ca30c"/></marker>
<marker id="arBad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d03b3b"/></marker>
<marker id="arS5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e87ba4"/></marker>
<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#c3c2b7" stroke-width="3"/></pattern>
</defs>
<rect x="-18" y="-18" width="800" height="336" rx="12" fill="#fcfcfb" stroke="#e4e4e3"/>

  
  
  <line x1="30" y1="270" x2="30" y2="26" stroke="#c3c2b7" stroke-width="1.6" fill="none" marker-end="url(#ar1)"/>
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#898781" x="24" y="150" transform="rotate(-90 24 150)" text-anchor="middle">the unit grows · the human moves further away</text>

  <g>
    <rect x="52" y="238" width="220" height="44" rx="9" fill="#e7f0fc" stroke="#2a78d6" stroke-width="1.4"/>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" x="66" y="258">1. Prompt</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="66" y="273">one sentence</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="292" y="264">human steps in every turn</text>
  </g>
  <g>
    <rect x="52" y="186" width="290" height="44" rx="9" fill="#fdece5" stroke="#eb6834" stroke-width="1.4"/>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" x="66" y="206">2. Context</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="66" y="221">one window</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="362" y="212">human decides what goes in</text>
  </g>
  <g>
    <rect x="52" y="134" width="360" height="44" rx="9" fill="#e3f6ee" stroke="#1baf7a" stroke-width="1.4"/>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" x="66" y="154">3. Harness</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="66" y="169">one run</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="432" y="160">human presses start</text>
  </g>
  <g>
    <rect x="52" y="82" width="440" height="44" rx="9" fill="#fdf3dc" stroke="#eda100" stroke-width="1.4"/>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" x="66" y="102">4. Loop</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="66" y="117">the repetition itself</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="512" y="108">human designs the loop</text>
  </g>
  <g>
    <rect x="52" y="30" width="530" height="44" rx="9" fill="#fdedf3" stroke="#e87ba4" stroke-width="1.4"/>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" x="66" y="50">5. Graph</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="66" y="65">the arrangement of agents</text>
    <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#52514e" x="602" y="56">human designs the structure</text>
  </g>

